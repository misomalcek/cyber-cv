name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Types and the build must pass anywhere. The stats freshness check is
      # deliberately NOT here: it queries Postgres and Qdrant on the machine the
      # hive runs on, and a gate that cannot run in CI should not pretend to.
      # Freshness is a pre-deploy step, documented in the README.
      - run: npx astro check
      - run: npm run build
